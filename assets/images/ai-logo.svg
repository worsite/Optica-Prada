<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="gearGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C8A951"/>
      <stop offset="100%" style="stop-color:#8A6520"/>
    </linearGradient>
  </defs>

  <!-- Gear shape -->
  <g transform="translate(100,100)">
    <path d="
      M 0,-72 L 8,-80 L 16,-72
      L 28,-78 L 30,-68
      L 44,-62 L 40,-52
      L 52,-42 L 45,-34
      L 50,-20 L 40,-18
      L 42,-2 L 32,-2
      L 28,14 L 18,10
      L 10,24 L 2,18
      L -6,28 L -14,20
      L -26,28 L -30,18
      L -44,18 L -44,8
      L -56,-4 L -48,-10
      L -50,-26 L -40,-26
      L -44,-42 L -34,-42
      L -32,-58 L -22,-54
      L -14,-68 L -6,-62
      Z
    " fill="#334155" opacity="0.9"/>

    <!-- Better gear using polygon approach -->
  </g>

  <!-- Gear (proper) -->
  <g transform="translate(100,100)">
    <path fill="#2D3F52" d="
      M12,-65 L18,-78 L6,-78 L12,-65
      M30,-56 L42,-65 L36,-56
      M50,-40 L64,-44 L58,-36
      M60,-20 L74,-18 L68,-10
      M62,2 L76,6 L70,14
      M54,22 L66,30 L60,38
      M40,38 L48,50 L40,54
      M20,50 L22,64 L14,62
      M0,56 L0,70 L-8,68
      M-20,50 L-24,64 L-32,60
      M-40,38 L-48,50 L-52,44
      M-54,22 L-66,28 L-66,20
      M-62,2 L-76,4 L-74,-4
      M-60,-20 L-74,-20 L-70,-28
      M-50,-40 L-62,-46 L-56,-54
      M-30,-56 L-40,-66 L-32,-70
      M-12,-65 L-14,-78 L-6,-80
    "/>

    <!-- Main gear body -->
    <circle r="68" fill="#2D3F52"/>
    <!-- Gear teeth via clipped ring -->
    <circle r="68" fill="none" stroke="#2D3F52" stroke-width="16" stroke-dasharray="18 8.5" transform="rotate(-5)"/>
    <!-- Inner ring -->
    <circle r="52" fill="#1E2D3D"/>
    <!-- Center gold circle -->
    <circle r="34" fill="#C8A951"/>
    <!-- Circuit lines -->
    <g stroke="#C8A951" stroke-width="1.5" fill="none" opacity="0.8">
      <line x1="0" y1="-34" x2="0" y2="-48"/>
      <line x1="0" y1="-48" x2="-12" y2="-48"/>
      <circle cx="-12" cy="-48" r="2.5" fill="#C8A951"/>

      <line x1="20" y1="-26" x2="34" y2="-34"/>
      <line x1="34" y1="-34" x2="34" y2="-44"/>
      <circle cx="34" cy="-44" r="2.5" fill="#C8A951"/>

      <line x1="34" y1="0" x2="48" y2="0"/>
      <line x1="48" y1="0" x2="48" y2="-10"/>
      <circle cx="48" cy="-10" r="2.5" fill="#C8A951"/>

      <line x1="20" y1="26" x2="34" y2="34"/>
      <line x1="34" y1="34" x2="44" y2="34"/>
      <circle cx="44" cy="34" r="2.5" fill="#C8A951"/>

      <line x1="0" y1="34" x2="0" y2="48"/>
      <line x1="0" y1="48" x2="10" y2="48"/>
      <circle cx="10" cy="48" r="2.5" fill="#C8A951"/>

      <line x1="-20" y1="26" x2="-34" y2="34"/>
      <line x1="-34" y1="34" x2="-34" y2="44"/>
      <circle cx="-34" cy="44" r="2.5" fill="#C8A951"/>

      <line x1="-34" y1="0" x2="-48" y2="0"/>
      <line x1="-48" y1="0" x2="-48" y2="10"/>
      <circle cx="-48" cy="10" r="2.5" fill="#C8A951"/>

      <line x1="-20" y1="-26" x2="-34" y2="-34"/>
      <line x1="-34" y1="-34" x2="-44" y2="-34"/>
      <circle cx="-44" cy="-34" r="2.5" fill="#C8A951"/>
    </g>
    <!-- AI text -->
    <text x="0" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="white" letter-spacing="2">AI</text>
  </g>
</svg>
