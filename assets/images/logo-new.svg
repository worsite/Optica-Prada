<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f5d97a"/>
      <stop offset="35%"  stop-color="#d4af37"/>
      <stop offset="65%"  stop-color="#c49a2a"/>
      <stop offset="100%" stop-color="#f5d97a"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#e8cc6a"/>
      <stop offset="50%"  stop-color="#b8932a"/>
      <stop offset="100%" stop-color="#f0d060"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left lens frame -->
  <rect x="8" y="14" width="108" height="68" rx="20" ry="20"
        stroke="url(#goldGrad)" stroke-width="4" fill="none" filter="url(#glow)"/>

  <!-- Right lens frame -->
  <rect x="204" y="14" width="108" height="68" rx="20" ry="20"
        stroke="url(#goldGrad)" stroke-width="4" fill="none" filter="url(#glow)"/>

  <!-- Bridge / nose piece -->
  <path d="M116 48 Q130 38 160 38 Q190 38 204 48"
        stroke="url(#goldGrad)" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- Temple left -->
  <line x1="8" y1="30" x2="2" y2="22" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
  <!-- Temple right -->
  <line x1="312" y1="30" x2="318" y2="22" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>

  <!-- Central mechanical iris / lente mecánica en el puente -->
  <!-- Outer ring -->
  <circle cx="160" cy="48" r="18" stroke="url(#goldGrad2)" stroke-width="2" fill="rgba(10,18,40,0.7)"/>
  <!-- Mid ring -->
  <circle cx="160" cy="48" r="12" stroke="url(#goldGrad2)" stroke-width="1.5" fill="none" opacity="0.85"/>
  <!-- Inner ring -->
  <circle cx="160" cy="48" r="7"  stroke="url(#goldGrad2)" stroke-width="1.5" fill="none" opacity="0.8"/>
  <!-- Center sphere -->
  <circle cx="160" cy="48" r="3.5" fill="url(#goldGrad)" filter="url(#glow)"/>
  <!-- Circuit lines (4 directions) -->
  <line x1="160" y1="30" x2="160" y2="36" stroke="url(#goldGrad2)" stroke-width="1.2" opacity="0.9"/>
  <line x1="160" y1="60" x2="160" y2="66" stroke="url(#goldGrad2)" stroke-width="1.2" opacity="0.9"/>
  <line x1="142" y1="48" x2="148" y2="48" stroke="url(#goldGrad2)" stroke-width="1.2" opacity="0.9"/>
  <line x1="172" y1="48" x2="178" y2="48" stroke="url(#goldGrad2)" stroke-width="1.2" opacity="0.9"/>
  <!-- Diagonal tick marks on outer ring -->
  <line x1="152.7" y1="35.7" x2="155.0" y2="38.0" stroke="url(#goldGrad2)" stroke-width="1" opacity="0.7"/>
  <line x1="167.3" y1="35.7" x2="165.0" y2="38.0" stroke="url(#goldGrad2)" stroke-width="1" opacity="0.7"/>
  <line x1="152.7" y1="60.3" x2="155.0" y2="58.0" stroke="url(#goldGrad2)" stroke-width="1" opacity="0.7"/>
  <line x1="167.3" y1="60.3" x2="165.0" y2="58.0" stroke="url(#goldGrad2)" stroke-width="1" opacity="0.7"/>

  <!-- ÓPTICA PRADA text -->
  <text x="160" y="100" text-anchor="middle"
        font-family="Georgia, 'Playfair Display', serif"
        font-size="22" font-weight="700" letter-spacing="6"
        fill="url(#goldGrad)" filter="url(#glow)">ÓPTICA PRADA</text>

  <!-- Tagline -->
  <text x="160" y="116" text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="8" font-weight="400" letter-spacing="3"
        fill="#c49a2a" opacity="0.85">CUIDAMOS TU VISIÓN</text>
</svg>
