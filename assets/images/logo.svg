<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5D782;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#C8A951;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E8C84A;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#A07828;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4A843;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F0C040;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#C8951E;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#E8C040;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#906010;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Eye outline - upper arc (eyelid curves) -->
  <!-- Main eye shape: spiral iris -->
  <g transform="translate(400, 155) scale(1.1)" filter="url(#glow)">
    <!-- Outer eye shape lines - upper -->
    <path d="M -145 -20 Q -80 -85 0 -90 Q 80 -85 145 -20" fill="none" stroke="url(#goldGrad)" stroke-width="9" stroke-linecap="round"/>
    <path d="M -120 -8 Q -65 -70 0 -74 Q 65 -70 120 -8" fill="none" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round"/>
    <path d="M -95 5 Q -50 -52 0 -56 Q 50 -52 95 5" fill="none" stroke="url(#goldGrad)" stroke-width="5.5" stroke-linecap="round"/>

    <!-- Outer eye shape lines - lower -->
    <path d="M -145 -20 Q -80 40 0 44 Q 80 40 145 -20" fill="none" stroke="url(#goldGrad)" stroke-width="9" stroke-linecap="round"/>
    <path d="M -120 -8 Q -65 35 0 38 Q 65 35 120 -8" fill="none" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round"/>

    <!-- Diagonal accent lines (lashes/lids) -->
    <line x1="-145" y1="-20" x2="-175" y2="-45" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
    <line x1="-120" y1="-8" x2="-158" y2="-30" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>
    <line x1="-95" y1="5" x2="-128" y2="-12" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>

    <line x1="145" y1="-20" x2="175" y2="-45" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
    <line x1="120" y1="-8" x2="158" y2="-30" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>
    <line x1="95" y1="5" x2="128" y2="-12" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>

    <!-- Iris spiral circles -->
    <circle cx="0" cy="-20" r="52" fill="none" stroke="url(#goldGrad)" stroke-width="7"/>
    <circle cx="0" cy="-20" r="36" fill="none" stroke="url(#goldGrad)" stroke-width="6"/>
    <circle cx="0" cy="-20" r="22" fill="none" stroke="url(#goldGrad)" stroke-width="5"/>
    <circle cx="0" cy="-20" r="10" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>

    <!-- Spiral inner arc -->
    <path d="M 22 -20 A 22 22 0 0 1 -5 2" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>

    <!-- Sparkle bottom right of eye -->
    <g transform="translate(155, 30)">
      <line x1="0" y1="-8" x2="0" y2="8" stroke="url(#goldGrad)" stroke-width="2.5"/>
      <line x1="-8" y1="0" x2="8" y2="0" stroke="url(#goldGrad)" stroke-width="2.5"/>
      <line x1="-5" y1="-5" x2="5" y2="5" stroke="url(#goldGrad)" stroke-width="1.5"/>
      <line x1="5" y1="-5" x2="-5" y2="5" stroke="url(#goldGrad)" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Text: OPTICA PRADA -->
  <text
    x="400" y="340"
    text-anchor="middle"
    font-family="'Trajan Pro', 'Times New Roman', Georgia, serif"
    font-size="72"
    font-weight="bold"
    letter-spacing="14"
    fill="url(#goldText)"
    filter="url(#glow)"
  >OPTICA  PRADA</text>
</svg>
