<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Preview Óptica Prada</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#030b1a;color:#f2e8d0;font-family:Georgia,serif}
:root{--gold:#d4af37;--gold-dark:#9a7c25;--navy:#030b1a}

/* NAVBAR */
.navbar{
  background:#030b1a;
  border-bottom:1px solid rgba(212,175,55,0.2);
  padding:1rem 2.5rem;
  display:flex;align-items:center;
}
.navbar img{height:56px;width:auto;display:block}

/* LOGO DEMO */
.logo-demo{
  background:#030b1a;
  padding:3rem 2rem;text-align:center;
  border-bottom:1px solid rgba(212,175,55,0.12);
}
.logo-demo p{color:rgba(212,175,55,0.5);font-family:Arial,sans-serif;font-size:0.8rem;margin-top:1rem}

/* VISION SECTION */
.section-vision{
  background:linear-gradient(180deg,#030b1a,#061228);
  padding:4rem 2rem;
}
.container{max-width:920px;margin:0 auto}
.eyebrow{color:var(--gold);font-family:Arial,sans-serif;font-size:0.72rem;
  letter-spacing:0.2em;text-transform:uppercase;margin-bottom:0.75rem;display:block}
h2{font-size:2.2rem;margin-bottom:0.5rem}
h2 span{color:var(--gold)}
.sub{color:rgba(242,232,208,0.6);font-family:Arial,sans-serif;font-size:0.92rem;
  line-height:1.6;margin-bottom:2.5rem}

/* SLIDER */
.slider-wrap{
  position:relative;border-radius:14px;overflow:hidden;
  cursor:ew-resize;user-select:none;touch-action:none;
  box-shadow:0 20px 60px rgba(0,0,0,0.7);
  line-height:0;
}
/* Imagen base — define la altura del contenedor */
.slider-wrap > .base-img{
  display:block;width:100%;height:auto;pointer-events:none;visibility:hidden;
}
/* Ambos paneles: absolutos, cubren TODO el contenedor */
.panel{
  position:absolute;top:0;left:0;width:100%;height:100%;
  overflow:hidden;
}
.panel img{
  position:absolute;top:0;left:0;
  width:100%;height:100%;
  object-fit:cover;object-position:center;
  pointer-events:none;display:block;
}
.panel-before{clip-path:inset(0 50% 0 0);will-change:clip-path}
.panel-before img{filter:blur(7px) saturate(0.2) brightness(0.6)}
.panel-after{clip-path:inset(0 0 0 50%);will-change:clip-path}
.panel-after img{filter:saturate(1.1) brightness(1.02)}

/* Etiquetas */
.vlabel{
  position:absolute;bottom:1.25rem;
  background:rgba(0,0,0,0.72);backdrop-filter:blur(8px);
  border-radius:20px;padding:0.3rem 0.9rem;
  font-size:0.7rem;font-weight:700;letter-spacing:0.12em;
  text-transform:uppercase;font-family:Arial,sans-serif;
  pointer-events:none;z-index:20;
}
.vlabel-before{left:1.25rem;color:rgba(255,255,255,0.55);border:1px solid rgba(255,255,255,0.15)}
.vlabel-after{right:1.25rem;color:var(--gold);border:1px solid var(--gold-dark)}

/* Handle */
.handle{
  position:absolute;top:0;bottom:0;
  width:3px;background:var(--gold);
  left:50%;transform:translateX(-50%);
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;z-index:30;
}
.handle-btn{
  width:40px;height:40px;border-radius:50%;
  background:var(--gold);display:flex;align-items:center;justify-content:center;
  color:#0a0800;font-weight:700;font-size:1rem;flex-shrink:0;
  box-shadow:0 0 0 4px rgba(212,175,55,0.3),0 4px 16px rgba(0,0,0,0.5);
  pointer-events:all;cursor:ew-resize;
}
</style>
</head>

<script>
(function(){
  const wrap   = document.getElementById('slider');
  const before = document.getElementById('panelBefore');
  const after  = document.getElementById('panelAfter');
  const handle = document.getElementById('handle');
  let dragging = false;

  function setPos(clientX){
    const rect = wrap.getBoundingClientRect();
    let pct = (clientX - rect.left) / rect.width;
    pct = Math.max(0.01, Math.min(0.99, pct));
    before.style.clipPath = `inset(0 ${((1-pct)*100).toFixed(2)}% 0 0)`;
    after.style.clipPath  = `inset(0 0 0 ${(pct*100).toFixed(2)}%)`;
    handle.style.left = (pct*100).toFixed(2) + '%';
  }

  wrap.addEventListener('mousedown', e=>{ dragging=true; setPos(e.clientX); e.preventDefault(); });
  window.addEventListener('mousemove', e=>{ if(dragging) setPos(e.clientX); });
  window.addEventListener('mouseup', ()=>{ dragging=false; });
  wrap.addEventListener('touchstart', e=>{ dragging=true; setPos(e.touches[0].clientX); },{passive:true});
  window.addEventListener('touchmove', e=>{ if(dragging) setPos(e.touches[0].clientX); },{passive:true});
  window.addEventListener('touchend', ()=>{ dragging=false; });
})();
</script>
